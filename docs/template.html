<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dora, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: fixed left table of contents, one readable column of text, code may run wider */
  --paper: #f7f8f6;
  --ink: #18212b;
  --muted: #5a6672;
  --rule: #dfe3e0;
  --accent: #0a6c8f;
  --accent-soft: #e2f0f5;
  --panel: #ffffff;
  --code-bg: #121a22;
  --code-ink: #dde4ea;
  --code-key: #f2b36b;
  --code-str: #8fd0ec;
  --code-com: #7d8a96;
  --code-ln: #4f5d6a;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11171d; --ink: #e6ebef; --muted: #9aa7b3; --rule: #26313b;
    --accent: #5cc2e6; --accent-soft: #15303c; --panel: #171f27;
    --code-bg: #0b1015; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11171d; --ink: #e6ebef; --muted: #9aa7b3; --rule: #26313b;
  --accent: #5cc2e6; --accent-soft: #15303c; --panel: #171f27;
  --code-bg: #0b1015; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100%; }
nav.toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 40px 24px; border-right: 1px solid var(--rule); background: var(--panel); }
nav.toc .brand { font-weight: 700; font-size: 18px; margin: 0 0 4px; }
nav.toc .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
nav.toc a { display: block; text-decoration: none; color: var(--ink); border-radius: 6px; }
nav.toc a.l1 { font-weight: 600; font-size: 14.5px; padding: 6px 8px; margin-top: 8px; }
nav.toc a.l2 { color: var(--muted); font-size: 13.5px; padding: 3px 8px 3px 20px; }
nav.toc a:hover { background: var(--accent-soft); color: var(--ink); }
nav.toc a:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding: 48px 56px 120px; min-width: 0; }
main > * { max-width: 780px; }
main > figure, main > table, main > pre, main > .graph { max-width: 1040px; }
h1 { font-size: 34px; line-height: 1.2; margin: 72px 0 12px; padding-top: 24px; border-top: 1px solid var(--rule); text-wrap: balance; }
h1:first-child { margin-top: 0; border-top: 0; padding-top: 0; font-size: 40px; }
h2 { font-size: 23px; line-height: 1.3; margin: 40px 0 8px; text-wrap: balance; }
p, li { color: var(--ink); }
ul, ol { padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
a { color: var(--accent); }
strong { font-weight: 600; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
pre code { background: none; padding: 0; font-size: inherit; }
table { border-collapse: collapse; width: 100%; margin: 16px 0 24px; font-size: 15.5px; display: block; overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
th { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
td:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
pre { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 16px 18px; overflow-x: auto; font-family: var(--font-mono); font-size: 14px; line-height: 1.55; }
figure { margin: 18px 0 22px; }
figure.file, figure.terminal { border-radius: 10px; overflow: hidden; background: var(--code-bg); }
figure figcaption { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 13px; padding: 9px 16px; color: var(--code-ink); background: #1d2832; }
figure.terminal figcaption { color: #9fd9a8; background: #16211b; }
figure figcaption .lines { color: var(--code-com); }
figure pre { margin: 0; border-radius: 0; }
pre.numbered { display: grid; grid-template-columns: max-content 1fr; column-gap: 16px; }
pre.numbered .ln { color: var(--code-ln); text-align: right; user-select: none; }
pre.numbered .code { white-space: pre; }
.k { color: var(--code-key); }
.s { color: var(--code-str); }
.c { color: var(--code-com); }
.prompt { color: #9fd9a8; }
.cmd { color: #ffffff; font-weight: 500; }
.graph { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 24px; padding: 20px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; }
.graph .box { font-family: var(--font-mono); font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); }
.graph .arrow { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.menu-toggle { display: none; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); max-height: 50vh; }
  main { padding: 28px 16px 80px; }
  h1:first-child { font-size: 32px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="layout">
<nav class="toc" aria-label="Sections">
<p class="brand">dora, step by step</p>
<p class="sub">dora 1.1.0 · official examples · tested on macOS</p>
{{NAV}}
</nav>
<main>
{{BODY}}
</main>
</div>
</body>
</html>
