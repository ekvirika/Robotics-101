# Lesson 2: the lesson-1 arm as a dora dataflow.
# One simulation, seven programs (nodes) talking to each other.
#
#   goals ──goal──▶ arm (planner ─▶ controller) ──torque──▶ sim
#     ▲                         ▲                             │
#     │                         └────────joint_state──────────┤
#   timer                safety ◀──joint_state────────────────┤
#                          └──estop──▶ controller             │
#                plots, viewer3d ◀──joint_state───────────────┘

strict_types: true # a type mismatch is an error, not a warning

env: # given to every node
  MODEL: ../01-mujoco-basics/pendulum.xml
  PYTHONPATH: ../01-mujoco-basics # so nodes can import trajectory.py and controller.py

nodes:
  - id: sim
    name: robot
    description: MuJoCo physics. On the real robot this is the motor driver.
    path: uv
    args: run --no-sync python -u nodes/sim.py
    inputs:
      tick: dora/timer/millis/2 # 500 physics steps per second
      torque: arm/torque
    outputs:
      - joint_state # [time, angle, speed, motor torque]
    output_types:
      joint_state: std/core/v1/Float64

  - id: goals
    name: task
    description: sends the next goal angle every 3 seconds
    path: uv
    args: run --no-sync python -u nodes/goals.py
    inputs:
      tick: dora/timer/secs/3
    outputs:
      - goal
    output_types:
      goal: std/core/v1/Float64
    env:
      GOALS_DEG: "90,45,-30,120,0"

  - id: arm
    module: modules/joint_control.yml # planner + controller, see that file
    inputs:
      goal: goals/goal
      joint_state: sim/joint_state
      estop: safety/estop

  - id: safety
    description: stops the arm if it leaves its range, moves too fast, or goes silent
    path: uv
    args: run --no-sync python -u nodes/safety.py
    inputs:
      joint_state:
        source: sim/joint_state
        input_timeout: 0.5 # no state for 0.5 s = the robot is dead
    outputs:
      - estop
    output_types:
      estop: std/core/v1/Bool
    env:
      MAX_ANGLE_DEG: 170
      MAX_SPEED: 2.0 # rad/s; the plan never goes above 1.5

  - id: plots
    description: live charts of goal, plan, real angle and torque (Rerun)
    path: uv
    args: run --no-sync python -u nodes/plots.py
    inputs:
      tick: dora/timer/millis/20 # draw 50 times a second
      joint_state: sim/joint_state
      reference: arm/reference
      goal: goals/goal
    restart_policy: on-failure # charts are not critical: restart them if they crash
    max_restarts: 3

  - id: viewer3d
    description: 3D window of the arm (MuJoCo viewer, needs mjpython on macOS)
    path: uv
    args: run --no-sync mjpython -u nodes/viewer3d.py
    inputs:
      tick: dora/timer/millis/16 # draw about 60 times a second
      joint_state:
        source: sim/joint_state
        queue_size: 250 # room for 0.5 s of states while the window draws its first slow frames
      goal: goals/goal
