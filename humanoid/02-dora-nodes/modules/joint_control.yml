# One joint's control: plan + controller.
# A humanoid reuses this module once per joint (the G1 has about 29).
module:
  name: joint_control
  inputs: [goal, joint_state, estop]
  outputs: [torque, reference]

nodes:
  - id: planner
    description: turns a goal into a smooth trajectory (speed up, cruise, slow down)
    path: pyrun
    args: nodes/planner.py
    inputs:
      goal: _mod/goal
      joint_state: _mod/joint_state
    outputs:
      - reference
    output_types:
      reference: std/core/v1/Float64

  - id: controller
    description: works out the motor torque that follows the plan
    path: pyrun
    args: nodes/joint_controller.py
    inputs:
      reference: planner/reference
      joint_state: _mod/joint_state
      estop: _mod/estop
    outputs:
      - torque
    output_types:
      torque: std/core/v1/Float64
