<text x="162.0" y="94.0" font-size="15" fill="#11151B" text-anchor="start" font-weight="bold">joint angles</text>
<text x="162.0" y="118.0" font-size="15" fill="#11151B" text-anchor="start" font-weight="normal">43</text>
<text x="154.0" y="158.0" font-size="13" fill="#5C6473" text-anchor="start" font-weight="normal">positions 1–43</text>
