<svg xmlns="http://www.w3.org/2000/svg" width="860" height="598" viewBox="0 0 860 598" font-family="Helvetica, Arial, sans-serif">
<title>The 16 mission steps over time</title>
<defs><marker id="h11151B" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#11151B"/></marker><marker id="h5C6473" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#5C6473"/></marker><marker id="h2457C5" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#2457C5"/></marker><marker id="hC9641A" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#C9641A"/></marker><marker id="h2A9D8F" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#2A9D8F"/></marker></defs>
<rect width="860" height="598" fill="#F7F6F2"/>
<text x="40.0" y="40.0" font-size="20" fill="#11151B" text-anchor="start" font-weight="bold">The 16 steps over time (one run, 42.3 s)</text>
<rect x="300.0" y="56.0" width="18.0" height="18.0" rx="3" fill="#2457C5"/>
<text x="326.0" y="71.0" font-size="15" fill="#3B4351" text-anchor="start" font-weight="normal">walk step</text>
<rect x="450.0" y="56.0" width="18.0" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="476.0" y="71.0" font-size="15" fill="#3B4351" text-anchor="start" font-weight="normal">arm step</text>
<rect x="600.0" y="56.0" width="18.0" height="18.0" rx="3" fill="#C9641A"/>
<text x="626.0" y="71.0" font-size="15" fill="#3B4351" text-anchor="start" font-weight="normal">hand step</text>
<line x1="300.0" y1="84.0" x2="300.0" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">0 s</text>
<line x1="355.6" y1="84.0" x2="355.6" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="355.6" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">5 s</text>
<line x1="411.1" y1="84.0" x2="411.1" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="411.1" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">10 s</text>
<line x1="466.7" y1="84.0" x2="466.7" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="466.7" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">15 s</text>
<line x1="522.2" y1="84.0" x2="522.2" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="522.2" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">20 s</text>
<line x1="577.8" y1="84.0" x2="577.8" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="577.8" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">25 s</text>
<line x1="633.3" y1="84.0" x2="633.3" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="633.3" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">30 s</text>
<line x1="688.9" y1="84.0" x2="688.9" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="688.9" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">35 s</text>
<line x1="744.4" y1="84.0" x2="744.4" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="744.4" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">40 s</text>
<line x1="800.0" y1="84.0" x2="800.0" y2="538.0" stroke="#DCD9D1" stroke-width="1" stroke-linecap="round"/>
<text x="800.0" y="560.0" font-size="14" fill="#5C6473" text-anchor="middle" font-weight="normal">45 s</text>
<text x="288.0" y="109.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">1. walk to table A</text>
<rect x="300.0" y="95.0" width="70.7" height="18.0" rx="3" fill="#2457C5"/>
<text x="288.0" y="137.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">2. raise the hand</text>
<rect x="370.7" y="123.0" width="24.2" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="165.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">3. move the open hand next to the bottle</text>
<rect x="394.9" y="151.0" width="24.2" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="193.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">4. move the hand around the bottle</text>
<rect x="419.1" y="179.0" width="11.8" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="221.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">5. close the hand</text>
<rect x="430.9" y="207.0" width="11.1" height="18.0" rx="3" fill="#C9641A"/>
<text x="288.0" y="249.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">6. lift the bottle</text>
<rect x="442.0" y="235.0" width="13.3" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="277.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">7. hold it close</text>
<rect x="455.3" y="263.0" width="11.8" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="305.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">8. step back</text>
<rect x="467.1" y="291.0" width="61.8" height="18.0" rx="3" fill="#2457C5"/>
<text x="288.0" y="333.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">9. walk to table B</text>
<rect x="528.9" y="319.0" width="97.3" height="18.0" rx="3" fill="#2457C5"/>
<text x="288.0" y="361.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">10. move the bottle over the mark</text>
<rect x="626.2" y="347.0" width="14.7" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="389.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">11. put it down</text>
<rect x="640.9" y="375.0" width="10.7" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="417.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">12. open the hand</text>
<rect x="651.6" y="403.0" width="11.1" height="18.0" rx="3" fill="#C9641A"/>
<text x="288.0" y="445.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">13. pull the hand away</text>
<rect x="662.7" y="431.0" width="11.8" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="473.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">14. raise the hand</text>
<rect x="674.4" y="459.0" width="23.1" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="501.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">15. arm down</text>
<rect x="697.6" y="487.0" width="24.0" height="18.0" rx="3" fill="#2A9D8F"/>
<text x="288.0" y="529.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">16. step back</text>
<rect x="721.6" y="515.0" width="48.0" height="18.0" rx="3" fill="#2457C5"/>
</svg>
