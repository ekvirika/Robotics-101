<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
<title>The standing robot as an upside-down pendulum</title>
<defs><marker id="h11151B" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#11151B"/></marker><marker id="h5C6473" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#5C6473"/></marker><marker id="h2457C5" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#2457C5"/></marker><marker id="hC9641A" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#C9641A"/></marker><marker id="h2A9D8F" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#2A9D8F"/></marker></defs>
<rect width="960" height="560" fill="#F7F6F2"/>
<text x="40.0" y="40.0" font-size="20" fill="#11151B" text-anchor="start" font-weight="bold">Standing still: an upside-down pendulum</text>
<line x1="60.0" y1="484.0" x2="520.0" y2="484.0" stroke="#5C6473" stroke-width="3" stroke-linecap="round"/>
<rect x="185.0" y="464.0" width="255.0" height="20.0" rx="6" fill="#C9C5BB"/>
<line x1="260.0" y1="450.0" x2="260.0" y2="90.0" stroke="#5C6473" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="260.0" y1="450.0" x2="317.3" y2="125.0" stroke="#11151B" stroke-width="9" stroke-linecap="round"/>
<circle cx="317.3" cy="125.0" r="34" fill="#11151B"/>
<circle cx="260.0" cy="450.0" r="13" fill="#F7F6F2" stroke="#11151B" stroke-width="4"/>
<line x1="317.3" y1="167.0" x2="317.3" y2="285.0" stroke="#C9641A" stroke-width="5" stroke-linecap="round" marker-end="url(#hC9641A)"/>
<text x="363.3" y="131.0" font-size="15" fill="#11151B" text-anchor="start" font-weight="normal">the robot’s weight: 34.4 kg</text>
<text x="335.3" y="235.0" font-size="15" fill="#C9641A" text-anchor="start" font-weight="normal">pulls it over when it leans</text>
<text x="246.0" y="285.0" font-size="15" fill="#3B4351" text-anchor="end" font-weight="normal">0.65 m</text>
<path d="M 306 424 A 52 52 0 0 0 214 424" fill="none" stroke="#2457C5" stroke-width="5" marker-end="url(#h2457C5)"/>
<text x="200.0" y="416.0" font-size="15" fill="#2457C5" text-anchor="end" font-weight="normal">ankles push back</text>
<text x="185.0" y="508.0" font-size="14" fill="#5C6473" text-anchor="start" font-weight="normal">foot: 5 cm behind the ankle, 12 cm in front</text>
<text x="560.0" y="120.0" font-size="15" fill="#5C6473" text-anchor="start" font-weight="normal">Weight sits</text>
<text x="560.0" y="142.0" font-size="16" fill="#11151B" text-anchor="start" font-weight="bold">2.1 cm in front of the ankle</text>
<text x="560.0" y="182.0" font-size="15" fill="#5C6473" text-anchor="start" font-weight="normal">and</text>
<text x="560.0" y="204.0" font-size="16" fill="#11151B" text-anchor="start" font-weight="bold">0.65 m above it</text>
<text x="560.0" y="244.0" font-size="15" fill="#5C6473" text-anchor="start" font-weight="normal">Leaning pulls it over with</text>
<text x="560.0" y="266.0" font-size="16" fill="#11151B" text-anchor="start" font-weight="bold">34.4 × 9.81 × 0.65 = 218 Nm per radian</text>
<text x="560.0" y="306.0" font-size="15" fill="#5C6473" text-anchor="start" font-weight="normal">Two ankles push back with</text>
<text x="560.0" y="328.0" font-size="16" fill="#11151B" text-anchor="start" font-weight="bold">2 × 250 = 500 Nm per radian</text>
<text x="560.0" y="368.0" font-size="15" fill="#5C6473" text-anchor="start" font-weight="normal"></text>
<text x="560.0" y="390.0" font-size="16" fill="#11151B" text-anchor="start" font-weight="bold">500 &gt; 218, so it stays up</text>
</svg>
