[project]
name = "dora-robotics"
version = "0.1.0"
description = "dora-rs examples and small robot simulations, runnable on a laptop"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dora-rs==1.1.0",
    "pyarrow>=17",
    "numpy>=2.0",
    "rerun-sdk>=0.24",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
]
sim = [
    "mujoco>=3.3",
    "onnxruntime>=1.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
