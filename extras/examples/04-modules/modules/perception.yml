module:
  name: perception
  inputs: [camera_feed]
  outputs: [detections]

nodes:
  - id: detector
    path: pyrun
    args: ../02-camera-pipeline/nodes/detector.py
    inputs:
      image:
        source: _mod/camera_feed
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - boxes
    env:
      PYTHONPATH: ../..
      DETECTOR: colour

  - id: counter
    path: pyrun
    args: nodes/box_counter.py
    inputs:
      boxes: detector/boxes
    outputs:
      - detections
    env:
      PYTHONPATH: ../..
