nodes:
  - id: counter
    path: uv
    args: run --no-sync python -u ../01-hello-graph/nodes/counter.py
    inputs:
      tick: dora/timer/millis/500
    outputs:
      - count
    output_types:
      count: std/core/v1/UInt64

  - id: printer
    path: uv
    args: run --no-sync python -u ../01-hello-graph/nodes/printer.py
    inputs:
      count: counter/count
    input_types:
      count: std/core/v1/UInt64
