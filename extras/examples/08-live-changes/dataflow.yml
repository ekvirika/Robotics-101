nodes:
  - id: sensor
    path: uv
    args: run --no-sync python -u nodes/sensor.py
    inputs:
      tick: dora/timer/millis/500
    outputs:
      - value

  - id: filter
    path: uv
    args: run --no-sync python -u nodes/filter.py
    inputs:
      value: sensor/value
    outputs:
      - value
    env:
      FILTER_VERSION: v1
      THRESHOLD: "10"

  - id: display
    path: uv
    args: run --no-sync python -u nodes/display.py
    inputs:
      value: filter/value
