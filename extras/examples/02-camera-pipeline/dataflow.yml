nodes:
  - id: camera
    path: uv
    args: run --no-sync python -u nodes/camera.py
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image
    env:
      PYTHONPATH: ../..
      CAMERA_SOURCE: synthetic
      CAMERA_INDEX: 0
      IMAGE_WIDTH: 640
      IMAGE_HEIGHT: 480

  - id: detector
    path: uv
    args: run --no-sync python -u nodes/detector.py
    inputs:
      image:
        source: camera/image
        queue_size: 1
        queue_policy: drop_oldest
    outputs:
      - boxes
    env:
      PYTHONPATH: ../..
      DETECTOR: colour
      YOLO_MODEL: yolo11n.pt
      MIN_CONFIDENCE: "0.4"

  - id: viewer
    path: uv
    args: run --no-sync python -u nodes/viewer.py
    inputs:
      image: camera/image
      boxes: detector/boxes
    env:
      PYTHONPATH: ../..
