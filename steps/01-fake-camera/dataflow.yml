# The official python-yolo-detection graph with one node swapped.
# webcam.py is replaced by fake_camera.py. The detector and the window are the
# official files, used unchanged from ../../official/python-yolo-detection/.
nodes:
  - id: webcam
    path: fake_camera.py
    inputs:
      tick: dora/timer/millis/50
    outputs:
      - image

  - id: object_detection
    path: ../../official/python-yolo-detection/object_detection.py
    restart_policy: on-failure
    inputs:
      image: webcam/image
    outputs:
      - bbox

  - id: plot
    path: ../../official/python-yolo-detection/plot.py
    restart_policy: on-failure
    inputs:
      image: webcam/image
      bbox: object_detection/bbox
