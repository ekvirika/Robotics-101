# Step 1's graph, made robust. Three changes, marked NEW.
nodes:
  - id: webcam
    path: fake_camera.py
    inputs:
      tick: dora/timer/millis/50
    outputs:
      - image

  - id: object_detection
    path: ../../official/python-yolo-detection/object_detection.py
    restart_policy: on-failure
    max_restarts: 5            # NEW: give up after 5 crashes instead of looping forever
    restart_delay: 1.0         # NEW: wait 1 s, then 2 s, 4 s ... before restarting
    inputs:
      image:
        source: webcam/image
        queue_size: 1          # NEW: keep only the newest frame waiting
        queue_policy: drop_oldest
    outputs:
      - bbox

  - id: plot
    path: ../../official/python-yolo-detection/plot.py
    restart_policy: on-failure
    inputs:
      image: webcam/image
      bbox: object_detection/bbox
