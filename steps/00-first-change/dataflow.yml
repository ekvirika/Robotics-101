# The official python-dataflow graph plus one new node, `checker`.
# Only the last block (marked NEW) is different from official/python-dataflow/dataflow.yml.
nodes:
  - id: sender
    path: sender.py
    outputs:
      - message

  - id: transformer
    path: transformer.py
    inputs:
      message: sender/message
    outputs:
      - transformed

  - id: receiver
    path: receiver.py
    inputs:
      message: sender/message
      transformed: transformer/transformed

  # NEW: a fourth node that listens to the transformer and reports even numbers
  - id: checker
    path: checker.py
    inputs:
      transformed: transformer/transformed
